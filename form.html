<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form><fieldset><legend>REGISTRATION_FORM</legend>
        <fieldset>
        <legend>Personal Data</legend>
        <label for="Student_name"> Name  :-</label>
        <input type="text" id="Student_name" name="Student_name" placeholder="Enter your name "> <br><br>
        <label for="email"> mail  :-</label>
        <input type="text" id="email" placeholder="Enter your email "> 
        <br><br>
        <label for="Phone_no"> Phone no :-</label>
        <input type="text" id="Phone_no" placeholder="Phone no">
        <br><br>
        <label> Gender :-</label> <br>
        <input type="radio" name="gender" value="male">male <br>
        <input type="radio" name="gender" value="female">female <br>
        </fieldset>
        <fieldset>
        <legend>Educational info</legend>
        <label for="clg_name" >College name :-</label>
        <input type="text" id="clg_name" name="clg_name" placeholder="College name"><br><br>
        <label for="degree"> Choose your degree :-</label>
        <select id="degree" name="degree">
            <option value="B.Tech">B.Tech</option>
            <option value="B.C.A">B.C.A</option>
            <option value="Pharmacy">Pharmacy</option>
        </select><br>
        <label>Subjects :-</label> <br>
        <input type="checkbox" name="Subjects" value="PPS">PPS<br>
        <input type="checkbox" name="Subjects" value="CFE">CFE<br>
        <input type="checkbox" name="Subjects" value="DSTL">DSTL<br>
        <input type="checkbox" name="Subjects" value="DLD">DLD<br>
        <label for="city"> Choose your city:-</label>
        <select id="city" name="city">
        <option value="delhi">Delhi</option>
        <option value="mumbai">Mumbai</option>
        <option value="kolkata">Kolkata</option>
        <option value="chennai">Chennai</option>
        </select><br><br>
        <label for="Planet"> Choose your planet:-</label>
        <select id="Planet" name="Planet">
        <option value="Earth">Earth</option>
        <option value="Mars">Mars</option>
        <option value="Venus">Venus</option>
        <option value="Mars">Mars</option>
        </select></fieldset></fieldset>
    </form>
</body>
</html>
